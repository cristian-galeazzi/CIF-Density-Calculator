name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push supersedes the running build for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.16.0
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the floor the README claims, and the version it is developed on
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # No path: pyproject sets --doctest-modules, and naming the test file
      # silently skips the >>> examples in cif_density.py.
      - name: Run the validation suite
        run: pytest -ra
